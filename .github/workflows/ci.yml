name: CI

on:
  pull_request:
  push:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-unit:
    name: build-and-unit
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Verify npm 11 runner
        run: ./scripts/npm11.sh --version

      - name: Install dependencies
        run: ./scripts/npm11.sh ci --include=optional

      # The lint gate must run on BUILT package types: type-aware rules
      # (e.g. no-unnecessary-type-assertion) resolve cross-package
      # @tezos-x/* imports from each package's dist; without it every
      # imported type degrades to `any` and the rules report false
      # positives on perfectly necessary assertions.
      - name: Build packages (types for the lint gate)
        run: ./scripts/npm11.sh run build:packages

      - name: Gate new lint findings
        env:
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ -n "$PR_BASE_SHA" ]; then
            export LINT_BASE_REF="$PR_BASE_SHA"
          elif [ -n "$PUSH_BEFORE_SHA" ] && [ "$PUSH_BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            export LINT_BASE_REF="$PUSH_BEFORE_SHA"
          elif [ -n "$PR_BASE_REF" ]; then
            export LINT_BASE_REF="origin/$PR_BASE_REF"
          fi
          ./scripts/npm11.sh run lint:new

      - name: Check workspace versions
        run: ./scripts/npm11.sh run check:versions

      - name: Build packages
        run: ./scripts/npm11.sh run build

      - name: Run unit tests
        run: ./scripts/npm11.sh run test

      - name: Run release script tests
        run: ./scripts/npm11.sh run test:scripts

  end-to-end:
    name: end-to-end
    # Playwright does not support chromium on ubuntu 26.04 yet, and
    # ubuntu-latest moved there in November 2026.
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Verify npm 11 runner
        run: ./scripts/npm11.sh --version

      - name: Install dependencies
        run: ./scripts/npm11.sh ci --include=optional

      - name: Check workspace versions
        run: ./scripts/npm11.sh run check:versions

      - name: Build packages
        run: ./scripts/npm11.sh run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Check example pages use only our relays
        run: node scripts/check-example-relays.mjs

      # Capture the exit code, write the timing record, then re-exit with the
      # test result so a failing suite still fails the job.
      - name: Run end-to-end tests
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: ci-metrics/playwright-results.json
        run: |
          mkdir -p ci-metrics
          started="$(date +%s)"
          set +e
          ./scripts/npm11.sh run e2e:smoke
          code=$?
          set -e
          node scripts/ci/write-e2e-metrics.js end-to-end "$code" "$started" ci-metrics/playwright-results.json || true
          exit "$code"

      - name: Upload e2e timing record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-timing-end-to-end
          path: ci-metrics/
          retention-days: 30
          if-no-files-found: warn

  # Report-only: probes the relays while the end-to-end job runs, so a failing
  # pairing test can be matched against relay faults afterwards.
  relay-health-monitor:
    name: relay-health-monitor
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    continue-on-error: true
    permissions:
      contents: read
      actions: read # list this run's jobs to see when end-to-end completes

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Poll relay health until end-to-end completes
        env:
          GITHUB_TOKEN: ${{ github.token }}
          POLL_INTERVAL_SECONDS: '15'
          POLL_MAX_DURATION_SECONDS: '1200'
          POLL_WATCH_JOB_NAME: end-to-end
        run: node scripts/ci/poll-relay-health.js

      - name: Upload relay health timeline
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relay-health-timeline
          path: ci-metrics/
          retention-days: 30
          if-no-files-found: warn

  firefox-extension-e2e:
    name: firefox-extension-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Non-blocking (#32): the real-Firefox content-script harness exercises the
    # genuine Xray compartment via Selenium + geckodriver. It is the only layer
    # that reproduces the membrane bug, but it is environment-sensitive; the
    # deterministic Jest compartment tests are the CI-blocking guard.
    continue-on-error: true

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Verify npm 11 runner
        run: ./scripts/npm11.sh --version

      - name: Install dependencies
        run: ./scripts/npm11.sh ci --include=optional

      - name: Build packages
        run: ./scripts/npm11.sh run build

      - name: Build eval-free SDK bundle (MV3 forbids eval)
        run: ./scripts/npm11.sh run webpack:sdk:ext

      - name: Install Firefox
        uses: browser-actions/setup-firefox@latest

      - name: Install geckodriver
        uses: browser-actions/setup-geckodriver@latest
        with:
          token: ${{ github.token }}

      - name: Run real-Firefox content-script harness (#32, headless via xvfb)
        run: |
          mkdir -p ci-metrics
          started="$(date +%s)"
          set +e
          xvfb-run -a ./scripts/npm11.sh run e2e:firefox-ext
          code=$?
          set -e
          node scripts/ci/write-e2e-metrics.js firefox-extension-e2e "$code" "$started" || true
          exit "$code"

      - name: Upload e2e timing record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-timing-firefox-extension-e2e
          path: ci-metrics/
          retention-days: 30
          if-no-files-found: warn
